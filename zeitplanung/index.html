<body>
<!-- Dieses Modul heisst jetzt "Timeline" und liegt unter ../timeline/ --
     dieser Stub bleibt hier stehen, damit bestehende Lesezeichen/
     Home-Bildschirm-Icons auf .../zeitplanung/ nicht ins Leere laufen,
     sondern automatisch dorthin weitergeleitet werden. Registriert
     ausserdem einen eigenen (neuen) Service Worker an diesem Scope, der den
     alten ersetzt und dadurch auch bereits offene, alte Tabs zuverlässig
     auf die neue Version stösst (siehe registerServiceWorkerWithAutoUpdate()
     in ../shared/common.js). -->
<script src="../shared/common.js"></script>
<script>
  registerServiceWorkerWithAutoUpdate();
  window.location.replace("../timeline/");
</script>
</body>
