<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2EFEA">
<title>Büro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/home-192.png">
<link rel="apple-touch-icon" href="icons/home-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
<style>
  .tile-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .tile {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border-radius: 20px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
  }
  .tile:active { background: var(--surface-2); }
  .tile-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    color: #fff;
  }
  .tile-text h2 {
    font-family: var(--font-medium);
    font-size: 17px;
    font-weight: normal;
    margin: 0 0 2px;
  }
  .tile-text p {
    margin: 0;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>Büro</h1>
</header>

<main>
  <div class="tile-grid">
    <a class="tile" href="zeiterfassung/">
      <span class="tile-icon" style="background:#4F7089">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm.5 5v5.25l4.25 2.52-.75 1.23L11 13V7h1.5z" fill="currentColor"/></svg>
      </span>
      <span class="tile-text">
        <h2>Zeiterfassung</h2>
        <p>Zeit pro Projekt erfassen, Nachtragen, Sync mit Nextcloud</p>
      </span>
    </a>

    <a class="tile" href="quittung/">
      <span class="tile-icon" style="background:#C97960">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M9 2L7.17 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2h-3.17L15 2H9zm3 15a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z" fill="currentColor"/></svg>
      </span>
      <span class="tile-text">
        <h2>Quittung</h2>
        <p>Belege fotografieren/hochladen, für Banana aufbereiten</p>
      </span>
    </a>

    <a class="tile" href="wettbewerbsprogramme/">
      <span class="tile-icon" style="background:#8F9A85">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 4h16v2H4zm0 5h16v2H4zm0 5h10v2H4zm0 5h7v2H4z" fill="currentColor"/></svg>
      </span>
      <span class="tile-text">
        <h2>Wettbewerbsprogramme</h2>
        <p>Architekturwettbewerbe hochladen und vergleichen</p>
      </span>
    </a>

    <a class="tile" href="offerten/">
      <span class="tile-icon" style="background:#BF9B4F">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" fill="currentColor"/></svg>
      </span>
      <span class="tile-text">
        <h2>Offerten</h2>
        <p>Offerten aus Modulen zusammenstellen, Kosten berechnen</p>
      </span>
    </a>
  </div>
</main>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  }
</script>
</body>
</html>
